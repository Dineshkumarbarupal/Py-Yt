name: Py-Yt CI

concurrency:
  group: py-yt-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pyyt
          MYSQL_USER: pyyt
          MYSQL_PASSWORD: pyyt-ci-password
          MYSQL_ROOT_PASSWORD: pyyt-root-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppyyt-root-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      SECRET_KEY: test-only-secret-key-that-is-long-enough-for-ci
      DATABASE_URL: mysql+pymysql://pyyt:pyyt-ci-password@127.0.0.1:3306/pyyt
      APP_ENV: test
      SESSION_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: cp .env.example .env && docker compose config --quiet
      - run: python -m compileall -q main.py api core config db middleware migrations services scripts webapp
      - run: node --check js/account.js && node --check js/api.js && node --check js/app.js && node --check js/auth.js && node --check js/channel.js && node --check js/library.js && node --check js/playlists.js && node --check js/playlist_detail.js && node --check js/subscriptions.js && node --check js/upload.js && node --check js/watch.js && node --check js/studio.js && node --check js/studio_content.js && node --check js/studio_analytics.js && node --check js/studio_comments.js && node --check js/settings.js && node --check js/notifications.js && node --check js/shorts.js && node --check js/admin_moderation.js && node --check js/queue.js
      - run: alembic upgrade head
      - run: python -m pytest -q

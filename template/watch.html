<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ video.title }} · Py-Yt</title><link rel="stylesheet" href="/css/app.css"></head><body>{% include "component/topbar.html" %}<main class="watch-layout" data-video-id="{{ video.id }}"><section><div class="player-shell"><video id="pyyt-player" controls playsinline preload="metadata"></video><p id="player-status" class="muted" role="status">Loading video…</p></div><div class="player-tools"><label>Speed<select id="player-speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>Normal</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select></label><button class="secondary-button" id="theater-toggle" type="button">Theater mode</button><button class="secondary-button" id="pip-toggle" type="button">Picture-in-picture</button></div><h1>{{ video.title }}</h1><p class="muted">{{ channel.name }} · {{ video.view_count }} views</p><p>{{ video.description }}</p><div class="watch-actions"><button class="secondary-button" id="like-button" type="button">♡ Like</button><button class="secondary-button" id="dislike-button" type="button">⊘ Dislike</button><button class="secondary-button" id="watch-later-button" type="button">◷ Watch later</button><button class="secondary-button" id="save-button" type="button">＋ Save to playlist</button><button class="secondary-button" id="share-button" type="button">↗ Share</button><button class="secondary-button" id="report-video-button" type="button">Report</button></div><section class="comments-panel"><h2>Comments</h2><form id="comment-form" class="comment-form"><textarea name="body" rows="3" maxlength="5000" placeholder="Add a comment…" required></textarea><button class="primary-button" type="submit">Comment</button><p id="comment-status" class="muted" role="status"></p></form><div id="comments-list" aria-live="polite"></div></section></section><aside class="watch-aside"><div class="up-next-heading"><h2>Up next</h2><label class="autoplay-toggle"><input id="autoplay-toggle" type="checkbox" checked> Autoplay</label></div><div id="up-next-list" class="up-next-list"><p class="muted">Loading videos…</p></div></aside></main><dialog id="playlist-dialog" class="playlist-dialog"><form id="playlist-form"><div class="dialog-heading"><h2>Save to playlist</h2><button type="button" id="close-playlist-dialog" class="icon-button" aria-label="Close">×</button></div><label>Choose playlist<select id="playlist-select" name="playlist_id"></select></label><div class="new-playlist-row"><label>Or create a new playlist<input id="new-playlist-title" maxlength="160" placeholder="Playlist name"></label></div><div class="dialog-actions"><button type="button" class="secondary-button" id="cancel-playlist">Cancel</button><button type="submit" class="primary-button">Save video</button></div><p id="playlist-status" class="muted" role="status"></p></form></dialog><dialog id="report-dialog" class="playlist-dialog"><form id="report-form"><div class="dialog-heading"><h2>Report content</h2><button type="button" class="icon-button" id="close-report-dialog" aria-label="Close">×</button></div><p class="muted" id="report-target-label">Tell us what is wrong with this content.</p><label>Reason<select name="reason" required><option value="spam">Spam or misleading</option><option value="harassment">Harassment or bullying</option><option value="hate">Hateful content</option><option value="violence">Violence or dangerous acts</option><option value="sexual_content">Sexual content</option><option value="misinformation">Misinformation</option><option value="copyright">Copyright concern</option><option value="privacy">Privacy concern</option><option value="other">Other</option></select></label><label>Additional details<textarea name="details" rows="3" maxlength="2000"></textarea></label><div class="dialog-actions"><button type="button" class="secondary-button" id="cancel-report">Cancel</button><button type="submit" class="primary-button">Submit report</button></div><p id="report-status" class="muted" role="status"></p></form></dialog><script type="module" src="/js/watch.js"></script></body></html>

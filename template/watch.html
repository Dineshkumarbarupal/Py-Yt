<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ video.title }} · Py-Yt</title><link rel="stylesheet" href="/css/app.css"></head><body>{% include "component/topbar.html" %}<main class="watch-layout" data-video-id="{{ video.id }}"><section><div class="player-shell"><video id="pyyt-player" controls playsinline preload="metadata"></video><p id="player-status" class="muted" role="status">Loading video…</p></div><h1>{{ video.title }}</h1><p class="muted">{{ channel.name }} · {{ video.view_count }} views</p><p>{{ video.description }}</p><div class="watch-actions"><button class="secondary-button" id="like-button" type="button">♡ Like</button><button class="secondary-button" id="save-button" type="button">＋ Save to playlist</button></div><section class="comments-panel"><h2>Comments</h2><form id="comment-form" class="comment-form"><textarea name="body" rows="3" maxlength="5000" placeholder="Add a comment…" required></textarea><button class="primary-button" type="submit">Comment</button><p id="comment-status" class="muted" role="status"></p></form><div id="comments-list" aria-live="polite"></div></section></section><aside class="watch-aside"><h2>Up next</h2><p class="muted">Recommendations will use your preferences and watch activity.</p></aside></main><dialog id="playlist-dialog" class="playlist-dialog"><form id="playlist-form"><div class="dialog-heading"><h2>Save to playlist</h2><button type="button" id="close-playlist-dialog" class="icon-button" aria-label="Close">×</button></div><label>Choose playlist<select id="playlist-select" name="playlist_id"></select></label><div class="new-playlist-row"><label>Or create a new playlist<input id="new-playlist-title" maxlength="160" placeholder="Playlist name"></label></div><div class="dialog-actions"><button type="button" class="secondary-button" id="cancel-playlist">Cancel</button><button type="submit" class="primary-button">Save video</button></div><p id="playlist-status" class="muted" role="status"></p></form></dialog><script type="module" src="/js/watch.js"></script></body></html>

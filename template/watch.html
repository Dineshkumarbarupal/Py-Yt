<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ video.title }} · Py-Yt</title><link rel="stylesheet" href="/css/app.css"></head><body>{% include "component/topbar.html" %}<main class="watch-layout" data-video-id="{{ video.id }}"><section><div class="player-shell"><video id="pyyt-player" controls playsinline preload="metadata"></video><p id="player-status" class="muted" role="status">Loading video…</p></div><h1>{{ video.title }}</h1><p class="muted">{{ channel.name }} · {{ video.view_count }} views</p><p>{{ video.description }}</p><div class="watch-actions"><button class="secondary-button" id="like-button" type="button">♡ Like</button><button class="secondary-button" id="save-button" type="button">＋ Save to playlist</button></div><section class="comments-panel"><h2>Comments</h2><p class="muted">Comments are shown when available.</p><div id="comments-list"></div></section></section><aside class="watch-aside"><h2>Up next</h2><p class="muted">Recommendations will use your preferences and watch activity.</p></aside></main><script type="module" src="/js/watch.js"></script></body></html>

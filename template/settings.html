<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · Py-Yt</title><link rel="stylesheet" href="/css/app.css"></head><body>{% include "component/topbar.html" %}<div class="app-layout">{% include "component/sidebar.html" %}<main class="main-content settings-page"><p class="eyebrow">ACCOUNT</p><h1>Settings</h1><p class="muted">Manage your profile and account security.</p><section class="settings-card"><h2>Profile</h2><form id="profile-form"><label>Display name<input name="display_name" minlength="2" maxlength="80" required></label><label>About you<textarea name="bio" rows="4" maxlength="500" placeholder="Tell viewers about yourself"></textarea></label><label>Avatar image URL<input name="avatar_url" type="url" maxlength="2048" placeholder="https://example.com/avatar.jpg"></label><button class="primary-button" type="submit">Save profile</button><p id="profile-status" class="muted" role="status"></p></form></section><section class="settings-card"><h2>Change password</h2><form id="password-form"><label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label><label>New password<input name="new_password" type="password" autocomplete="new-password" minlength="12" required></label><label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></label><button class="primary-button" type="submit">Update password</button><p id="password-status" class="muted" role="status"></p></form></section><section class="settings-card"><h2>Session</h2><p class="muted">Sign out of this browser session.</p><button class="secondary-button" type="button" id="logout-button">Sign out</button><p id="session-status" class="muted" role="status"></p></section></main></div><script type="module" src="/js/settings.js"></script></body></html>

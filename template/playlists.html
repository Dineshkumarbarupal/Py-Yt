<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Playlists · Py-Yt</title><link rel="stylesheet" href="/css/app.css"></head><body>{% include "component/topbar.html" %}<div class="app-layout">{% include "component/sidebar.html" %}<main class="main-content"><p class="eyebrow">YOUR LIBRARY</p><div class="library-title-row"><h1>Playlists</h1><button class="primary-button" id="new-playlist-button" type="button">＋ New playlist</button></div><div id="playlist-list" class="playlist-grid"><p class="muted">Loading playlists…</p></div><dialog id="create-playlist-dialog" class="playlist-dialog"><form id="create-playlist-form"><div class="dialog-heading"><h2>Create playlist</h2><button type="button" class="icon-button" id="close-create-playlist">×</button></div><label>Title<input name="title" maxlength="160" required placeholder="e.g. Learn Python"></label><label>Description<textarea name="description" rows="3" maxlength="5000"></textarea></label><label>Visibility<select name="visibility"><option value="private">Private</option><option value="unlisted">Unlisted</option><option value="public">Public</option></select></label><div class="dialog-actions"><button class="secondary-button" type="button" id="cancel-create-playlist">Cancel</button><button class="primary-button" type="submit">Create</button></div><p id="create-playlist-status" class="muted" role="status"></p></form></dialog><p id="playlist-page-status" class="muted" role="status"></p></main></div><script type="module" src="/js/playlists.js"></script></body></html>

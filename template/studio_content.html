<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your content · Py-Yt Studio</title><link rel="stylesheet" href="/css/app.css"></head><body>{% include "component/topbar.html" %}<div class="app-layout">{% include "component/sidebar.html" %}<main class="main-content"><p class="eyebrow">CREATOR STUDIO</p><h1>Your content</h1><p class="muted">Edit your uploaded videos and control their visibility.</p><div class="studio-content-filters">
  <input id="studio-search" type="search" maxlength="200" placeholder="Search your videos by title or description" aria-label="Search creator videos">
  <select id="studio-status-filter" aria-label="Filter by status"><option value="">All statuses</option><option value="draft">Draft</option><option value="uploading">Uploading</option><option value="ready">Ready</option><option value="published">Published</option><option value="failed">Failed</option><option value="removed">Removed by moderation</option><option value="deleted">Deleted</option></select>
  <select id="studio-visibility-filter" aria-label="Filter by visibility"><option value="">All visibility</option><option value="public">Public</option><option value="unlisted">Unlisted</option><option value="private">Private</option></select>
  <select id="studio-format-filter" aria-label="Filter by format"><option value="">All formats</option><option value="standard">Standard</option><option value="short">Shorts</option></select>
  <button id="studio-search-button" class="secondary-button" type="button">Filter</button>
</div>
<div class="studio-content-summary"><span id="studio-content-count" class="muted"></span><button id="studio-load-more" class="secondary-button hidden" type="button">Load more</button></div>
<div id="studio-content-list" class="studio-content-list"><p class="muted">Loading content…</p></div><p id="studio-content-status" class="muted" role="status"></p></main></div><script type="module" src="/js/studio_content.js"></script></body></html>

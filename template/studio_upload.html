<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload video · Py-Yt</title><link rel="stylesheet" href="/css/app.css"></head><body>{% include "component/topbar.html" %}<div class="app-layout">{% include "component/sidebar.html" %}<main class="main-content"><p class="eyebrow">CREATOR STUDIO</p><h1>Upload a video</h1><p class="muted">Upload an original video to your channel. Files go directly to your configured object-storage bucket.</p><section class="upload-card"><form id="upload-form"><label>Video title<input name="title" required minlength="1" maxlength="200" placeholder="Add a clear title"></label><label>Description<textarea name="description" rows="4" maxlength="10000" placeholder="Tell viewers about your video"></textarea></label><div class="upload-fields"><label>Category<select name="category"><option>General</option><option>Music</option><option>Gaming</option><option>Technology</option><option>Learning</option><option>Live</option><option>Comedy</option><option>Sports</option><option>News</option><option>Entertainment</option></select></label><label>Video format<select name="video_format"><option value="standard">Standard video</option><option value="short">Shorts (vertical)</option></select></label><label>Visibility<select name="visibility"><option value="public">Public</option><option value="unlisted">Unlisted</option><option value="private">Private</option></select></label></div><label>Video file<input id="video-file" type="file" accept="video/mp4,video/webm,video/quicktime" required></label><p class="muted">Supported: MP4, WebM, MOV. Maximum upload size is configured by the server.</p><button class="primary-button" id="upload-submit" type="submit">Upload and publish</button><p id="upload-status" class="form-message" role="status"></p></form></section></main></div><script type="module" src="/js/upload.js"></script></body></html>

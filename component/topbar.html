<header class="topbar">
  <button class="icon-button menu-toggle" id="menu-toggle" aria-label="Toggle navigation">☰</button>
  <a class="brand" href="/"><span class="brand-mark">▶</span><span>Py-Yt</span></a>
  <form class="search-form" id="search-form" role="search">
    <input id="search-query" name="q" type="search" placeholder="Search" aria-label="Search videos" autocomplete="off" list="search-suggestions">
    <button type="submit" aria-label="Search">⌕</button>
  </form>
  <datalist id="search-suggestions"></datalist>
  <div class="top-actions">
    <button class="icon-button" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">◐</button>
    <button class="icon-button queue-open-button" id="queue-open" type="button">Queue <span id="queue-count">0</span></button>
    <a class="icon-button" href="/studio" title="Create">＋</a>
    <a class="icon-button hidden" href="/admin/moderation" id="admin-link" title="Admin moderation">Admin</a>
    <a class="icon-button notification-link" id="notification-link" href="/notifications" title="Notifications" aria-label="Notifications">♧</a>
    <a class="avatar" href="/account" aria-label="Account">G</a>
  </div>
</header>
<dialog id="queue-dialog" class="queue-dialog">
  <div class="queue-dialog-heading"><div><p class="eyebrow">WATCH SESSION</p><h2>Queue</h2></div><button id="queue-close" class="icon-button" type="button" aria-label="Close queue">×</button></div>
  <div id="queue-items" class="queue-items"><p class="muted">Your queue is empty.</p></div>
  <div class="queue-dialog-footer"><span id="queue-status" class="muted" role="status"></span><button id="queue-clear" class="secondary-button" type="button">Clear queue</button></div>
</dialog>
<script type="module" src="/js/account.js"></script>
<script type="module" src="/js/queue.js"></script>
<script type="module" src="/js/video_actions.js"></script>
